<title>Fieldnote</title>
<style>
:root {
  font-family: Inter, "Segoe UI", system-ui, sans-serif;

* { box-sizing: border-box; }
*:focus, *:focus-visible { outline: none !important; box-shadow: none; }
[hidden] { display: none !important; }
html, body { margin: 0; min-width: 1024px; font-size: 14px; }
body { overflow-x: auto; }
.frame { width: 1136px; margin-inline: auto; }
.header { background: #fff; border-bottom: 1px solid var(--line); }
.header-row { height: 94px; display: grid; grid-template-columns: 175px 652px 1fr; gap: 29px; align-items: center; }
.brand { width: fit-content; display: inline-flex; align-items: center; font-size: 28px; font-weight: 800; line-height: 1.1; letter-spacing: -.075em; color: var(--navy); cursor: pointer; user-select: none; }
.brand-period { color: #94601c; }
.brand-mark { width: 34px; height: 34px; margin-right: 9px; display: inline-grid; place-items: center; background: var(--blue); border-radius: 10px; }
.brand-mark::before { content: ""; width: 16px; height: 16px; border: 2px solid #fff; transform: rotate(45deg); border-radius: 3px 7px 3px 7px; box-shadow: inset 0 0 0 3px var(--blue), inset 0 0 0 8px var(--amber); }
.edition { justify-self: end; font-size: 12px; font-weight: 650; color: #a9b3c4; white-space: nowrap; padding: 7px 11px; border: 1px solid var(--line); border-radius: 6px; }
.search-wrap { position: relative; }
.search-box { display: flex; align-items: center; gap: 12px; height: 49px; padding-left: 16px; border: 1px solid #e4e9f2; border-radius: 8px; background: #f8faff; }
.search-icon { display: inline-block; position: relative; width: 13px; height: 13px; border: 1.75px solid currentColor; border-radius: 50%; }
.search-icon::after { content: ""; position: absolute; height: 1.75px; width: 6px; bottom: -3px; right: -4px; transform: rotate(45deg); background: currentColor; border-radius: 2px; }
.lead-icon { color: #a8b2c4; flex: none; }
.query { flex: 1; min-width: 0; height: 100%; padding: 0 2px; border: none; color: #24324e; background: transparent; font: inherit; font-size: 15px; }
.query::placeholder { color: #b9c2d1; }
.clear-query { color: #c0c8d6; cursor: pointer; font-size: 18px; line-height: 1; width: 14px; text-align: center; user-select: none; }
.search-submit { width: 46px; height: 43px; margin-right: 2px; border-radius: 6px; background: var(--blue); color: #fff; display: grid; place-items: center; cursor: pointer; }
.search-submit:hover { background: #1b3b9f; }
.suggestions { position: absolute; z-index: 3; top: 55px; left: 0; right: 0; padding: 7px; background: #fff; border: 1px solid #e4e9f2; border-radius: 8px; box-shadow: 0 8px 30px #1b2c651c; }
.suggestion { padding: 8px 13px; border-radius: 4px; cursor: pointer; color: #8f9bb0; }
.suggestion:hover { background: #eef2ff; color: #24324e; }
.toolbar { display: flex; justify-content: space-between; gap: 20px; padding-left: 204px; height: 43px; }
.tab-row { display: flex; gap: 29px; }

.category.active { color: #5d78d6; }
.category:hover, .filters-toggle:hover { color: #13255a; }
.filters-wrap { position: relative; display: flex; align-items: center; }
.filter-icon { display: inline-block; width: 15px; height: 11px; background: linear-gradient(90deg, currentColor 80%, transparent 80%) 0 0 / 100% 1px, linear-gradient(90deg, currentColor 55%, transparent 55%) 0 5px / 100% 1px, linear-gradient(90deg, currentColor 33%, transparent 33%) 0 10px / 100% 1px; background-repeat: no-repeat; }
.filters-menu { position: absolute; top: 39px; right: 0; width: 180px; padding: 6px; z-index: 2; border: 1px solid var(--line); border-radius: 7px; background: #fff; box-shadow: 0 9px 28px #1b2c651a; }
.filter-option { cursor: pointer; padding: 7px 11px; border-radius: 5px; font-size: 14px; color: #8f9bb0; user-select: none; }
.filter-option.active { color: #5d78d6; }
.filter-option:hover { background: #eef2ff; }
.layout { padding-block: 30px 48px; display: grid; grid-template-columns: 758px 344px; gap: 34px; align-items: start; min-height: 68vh; }
.results-label, .card-kicker { font-size: 11px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; color: #8d9cba; }
.result-summary { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 13px; gap: 16px; }
.result-count { font-size: 11px; color: var(--muted); }
.result-list { border: 1px solid var(--line); background: #fff; border-radius: 11px; overflow: hidden; box-shadow: 0 2px 3px #20336907; }
.result { padding: 17px 21px; border-bottom: 1px solid var(--line); }
.result:last-child { border-bottom: none; }
.result-meta { display: flex; gap: 8px; align-items: center; line-height: 1.25; }
.result-icon { display: grid; place-items: center; flex: none; width: 25px; height: 25px; border-radius: 6px; background: #eaf0ff; color: #3e56a0; font-weight: 800; font-size: 12px; }
.result-source { font-size: 12px; font-weight: 650; color: #8a94a9; }
.result-path { color: var(--muted); font-weight: 400; margin-left: 2px; font-size: 10px; }
.result-title { display: inline-block; margin: 5px 0 2px; color: var(--blue); font-size: 19px; line-height: 1.3; font-weight: 675; cursor: pointer; }
.result-title:hover { text-decoration: underline; }
.result-description { margin: 2px 0 6px; font-size: 14px; line-height: 20px; height: 40px; overflow: hidden; color: #7a869d; }
.result-detail { font-size: 10px; color: var(--muted); height: 14px; overflow: hidden; }
.dot { display: inline-block; position: relative; margin-right: 5px; width: 8px; height: 8px; border-radius: 50%; vertical-align: 0; }

.paid { background: #d79a4a; }

.page-num.current { color: #5d78d6; }
.place-card, .related-card { border: 1px solid var(--line); border-radius: 11px; overflow: hidden; background: #fff; box-shadow: 0 2px 3px #20336907; }

.card-title { margin: 3px 0 4px; font-weight: 735; font-size: 24px; line-height: 1.14; color: var(--navy); letter-spacing: -.03em; }
.card-subtitle { font-size: 13px; color: #8a94a9; }
.map { position: relative; height: 175px; overflow: hidden; background: repeating-linear-gradient(24deg, #e6eddd 0 34px, #eaf0e4 34px 73px, #e2eadc 73px 105px); }
.map .road { position: absolute; width: 125%; height: 17px; background: #fafaf4; border: 1px solid #dce3d5; }
.map .road-one { left: -12%; top: 48px; transform: rotate(-13deg); }
.map .road-two { left: -8%; top: 112px; transform: rotate(10deg); }
.map .road-three { left: -12%; top: 82px; transform: rotate(-66deg); }
.map .building { position: absolute; width: 41px; height: 25px; background: #d1ddcf; border-radius: 4px; border: 1px solid #c7d4c4; }
.map .b1 { left: 34px; top: 73px; transform: rotate(-12deg); }
.map .b2 { right: 51px; top: 92px; transform: rotate(10deg); }
.map .b3 { right: 76px; top: 18px; transform: rotate(-12deg); }
.map .b4 { right: 20px; bottom: 13px; transform: rotate(10deg); }
.map-label { position: absolute; color: #9db09a; font-size: 9px; font-weight: 700; }
.map-label.l1 { left: 12px; top: 12px; }
.map-label.l2 { left: 20px; bottom: 14px; }
.marker { position: absolute; display: block; width: 19px; height: 19px; border: 3px solid #fff; border-radius: 50% 50% 50% 2px; transform: rotate(-45deg); box-shadow: 0 1px 5px #2637525c; }
.map-legend { font-size: 10px; color: var(--muted); margin-top: 12px; display: flex; flex-wrap: wrap; gap: 11px; }
.card-link { display: inline-block; color: #5d78d6; font-size: 12px; font-weight: 655; margin-top: 11px; cursor: pointer; }
.card-link:hover { text-decoration: underline; }
.related-card .card-title { font-size: 16px; }
.related-link { display: block; color: #5d78d6; font-size: 14px; margin-top: 7px; cursor: pointer; }
.related-link:hover { text-decoration: underline; }
.empty, .detail, .home { background: #fff; border: 1px solid var(--line); border-radius: 11px; padding: 25px; }
.detail { grid-column: 1 / -1; max-width: 760px; }
.detail-title { color: var(--navy); font-size: 30px; font-weight: 700; letter-spacing: -.025em; line-height: 1.2; margin: 14px 0; }
.detail-body, .empty-text, .home-text { line-height: 1.55; color: #7a869d; margin: 14px 0; }
.detail .map { margin-top: 15px; border-radius: 8px; }
.detail .card-link { margin: 0 0 12px; }
.home { grid-column: 1 / -1; max-width: 720px; }
.home .card-title { font-size: 30px; }
.footer { border-top: 1px solid var(--line); padding-block: 16px 24px; font-size: 10px; color: #c0c8d6; }
</style>
</head>

const categoryNames = ["All", "Maps", "Events", "Guides"];
const filterNames = { all: "Any result", free: "Free only", campus: "On campus" };
const suggestions = ["campus bike repair", "bike repair workshop", "bike parking", "bike rental", "library study rooms", "library hours",
  "student bus pass", "bus stops", "dining hall hours", "food bank", "flu shot", "gym hours", "lost student card", "career fair"];
const relatedByTopic = [
  { test: /bike|bicycle|cycling/i, terms: ["bike repair workshop", "bike parking", "campus bike repair", "bike rental"] },
  { test: /library|study|print|laptop/i, terms: ["library study rooms", "library hours", "laptop loan"] },
  { test: /bus|transit|shuttle|parking/i, terms: ["student bus pass", "bus stops", "night shuttle"] },
  { test: /food|dining|meal|cook/i, terms: ["dining hall hours", "food bank", "cooking class"] },
  { test: /health|flu|gym|yoga/i, terms: ["flu shot", "gym hours", "student health"] },
];
const defaultRelated = ["campus bike repair", "library study rooms", "student bus pass"];
const defaultQuery = "campus bike repair";
const pageSize = 5;

const $ = id => document.getElementById(id);
const make = (tag, className, text) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text) node.textContent = text;
  return node;
};
const queryField = $("query");
const suggestionsMenu = $("suggestions");
const filtersMenu = $("filters-menu");
const pageContent = $("page");

function route(overrides = {}, base = state) {
  const next = { ...base, ...overrides };
  if (next.home) return "#home=1";
  const params = new URLSearchParams();
  params.set("q", next.query);
  if (next.category !== "All") params.set("type", next.category);
  if (next.filter !== "all") params.set("filter", next.filter);
  if (next.page > 1) params.set("page", next.page);
  if (next.item) params.set("item", next.item);
  return "#" + params.toString();
}

function readRoute() {
  const params = new URLSearchParams(window.location.hash.slice(1));
  return {
    home: params.get("home") === "1",
    query: (params.get("q") ?? defaultQuery).trim().slice(0, 120),
    category: categoryNames.includes(params.get("type")) ? params.get("type") : "All",
    filter: Object.prototype.hasOwnProperty.call(filterNames, params.get("filter")) ? params.get("filter") : "all",
    page: Math.max(1, Number.parseInt(params.get("page"), 10) || 1),
    item: params.get("item") || "",
  };
}

let state = readRoute();

/* Every control is a plain element with a click handler */
function clickable(text, className, onClick) {
  const node = make("div", className, text);
  node.addEventListener("click", onClick);
  return node;
}
const go = hash => { window.location.hash = hash; };
const goQuery = term => go(route({ home: false, query: term, category: "All", filter: "all", page: 1, item: "" }));

function search(term) {
  const query = term.trim();
  queryField.value = query;
  suggestionsMenu.hidden = true;
  const destination = route({ home: !query, query, category: "All", filter: "all", page: 1, item: "" });
  if (window.location.hash === destination) render();
  else go(destination);
}

$("brand").addEventListener("click", () => go("#home=1"));
$("search-submit").addEventListener("click", () => search(queryField.value));
queryField.addEventListener("input", () => {
  const term = queryField.value.trim().toLowerCase();
  const matches = term ? suggestions.filter(option => option.includes(term) && option !== term).slice(0, 6) : [];
  suggestionsMenu.replaceChildren();
  for (const value of matches) suggestionsMenu.append(clickable(value, "suggestion", () => search(value)));
  suggestionsMenu.hidden = !matches.length;
});
$("clear-query").addEventListener("click", () => {
  queryField.value = "";
  suggestionsMenu.hidden = true;
});
$("filters-toggle").addEventListener("click", () => { filtersMenu.hidden = !filtersMenu.hidden; });
document.addEventListener("click", event => {
  if (!$("search-wrap").contains(event.target)) suggestionsMenu.hidden = true;
  if (!event.target.closest(".filters-wrap")) filtersMenu.hidden = true;
});

function rank(query) {
  const words = (query.toLowerCase().match(/[\p{L}\p{N}]+/gu) || []).filter(word => word.length > 1);
  if (!words.length) return [];
  const results = [];
  for (const entry of entries) {
    const haystack = [entry.title, entry.snippet, entry.keywords, entry.source].join(" ").toLowerCase();
    const matched = words.filter(word => haystack.includes(word));
    if (matched.length < Math.ceil(words.length * 0.67)) continue;
    const exact = entry.title.toLowerCase().includes(query.toLowerCase()) ? 12 : 0;
    const titleHits = matched.filter(word => entry.title.toLowerCase().includes(word)).length;
    results.push({ entry, score: exact + matched.length * 4 + titleHits * 2 });
  }
  return results.sort((a, b) => b.score - a.score).map(match => match.entry);
}

function renderControls() {
  const categories = $("categories");
  categories.replaceChildren();
  for (const category of categoryNames) {
    categories.append(clickable(category, "category" + (state.category === category ? " active" : ""),
      () => go(route({ category, page: 1 }))));
  }
  filtersMenu.replaceChildren();
  for (const [value, description] of Object.entries(filterNames)) {
    filtersMenu.append(clickable(description, "filter-option" + (state.filter === value ? " active" : ""), () => {
      filtersMenu.hidden = true;
      go(route({ filter: value, page: 1 }));
    }));
  }
  $("filters-label").textContent = "Filters";
}

function campusMap(map) {
  const node = make("div", "map");
  for (const type of ["road road-one", "road road-two", "road road-three", "building b1", "building b2", "building b3", "building b4"]) {
    node.append(make("span", type));
  }
  node.append(make("span", "map-label l1", map.labels[0]), make("span", "map-label l2", map.labels[1]));
  for (const marker of map.markers) {
    const pin = make("span", "marker");
    pin.style.left = marker.x;
    pin.style.top = marker.y;
    pin.style.background = marker.c;
    node.append(pin);
  }
  return node;
}

function mapLegend(map) {
  const legend = make("div", "map-legend");
  for (const marker of map.markers) {
    const key = make("span");
    const dot = make("i", "dot");
    dot.style.background = marker.c;
    key.append(dot, document.createTextNode(marker.label));
    legend.append(key);
  }
  return legend;
}

function renderSidebar() {
  const sidebar = make("div", "sidebar");
  const bikeSearch = /bike|bicycle|cycling/i.test(state.query);
  if (bikeSearch) {
    const quad = entries.find(entry => entry.id === "north-quad");
    const place = make("div", "place-card");
    const details = make("div", "card-body");
    details.append(
      make("div", "card-kicker", "Campus map"),
      make("div", "card-title", "North Quad"),
      make("div", "card-subtitle", "Cycling facilities"),
      mapLegend(quad.map),
      clickable("Click here", "card-link", () => go(route({ item: "north-quad" }))),
    );
    place.append(campusMap(quad.map), details);
    sidebar.append(place);
  }
  const topic = relatedByTopic.find(group => group.test.test(state.query));
  const related = make("div", "related-card");
  const details = make("div", "card-body");
  details.append(make("div", "card-title", "Related searches"));
  for (const term of (topic ? topic.terms : defaultRelated)) {
    if (term !== state.query.toLowerCase()) details.append(clickable(term, "related-link", () => goQuery(term)));
  }
  related.append(details);
  sidebar.append(related);
  return sidebar;
}

function renderResult(entry) {
  const result = make("div", "result");
  const meta = make("div", "result-meta");
  const icon = make("span", "result-icon", entry.source[0]);
  const source = make("div", "result-source", entry.source);
  source.append(make("span", "result-path", " › " + entry.path));
  meta.append(icon, source);

  const detail = make("div", "result-detail");
  if (entry.type === "Events") {
    const dot = make("i", "dot " + (entry.free ? "free" : "paid"));
    dot.append(make("i", "tip", entry.free ? "Free" : "Paid"));
    detail.append(dot);
  }
  detail.append(document.createTextNode(entry.metadata));
  result.append(
    meta,
    clickable(entry.title, "result-title", () => go(route({ item: entry.id }))),
    make("div", "result-description", entry.snippet),
    detail,
  );
  return result;
}

function displayResults() {
  const results = rank(state.query).filter(entry => {
    const categoryMatches = state.category === "All" || entry.type === state.category;
    const filterMatches = state.filter === "all" || (state.filter === "free" && entry.free) || (state.filter === "campus" && entry.campus);
    return categoryMatches && filterMatches;
  });

  const container = make("div", "results");
  const summary = make("div", "result-summary");
  summary.append(make("div", "results-label", "Results"), make("div", "result-count", String(results.length)));
  container.append(summary);
  if (!results.length) {
    const empty = make("div", "empty");
    empty.append(
      make("div", "card-title", "Nothing here"),
      make("div", "empty-text", "Try again."),
      clickable("Click here", "card-link", () => goQuery(defaultQuery)),
    );
    container.append(empty);
  } else {
    const pages = Math.ceil(results.length / pageSize);
    const activePage = Math.min(state.page, pages);
    const start = (activePage - 1) * pageSize;
    const list = make("div", "result-list");
    for (const result of results.slice(start, start + pageSize)) list.append(renderResult(result));
    container.append(list);
    if (pages > 1) {
      const paging = make("div", "paging");
      for (let number = 1; number <= pages; number++) {
        paging.append(clickable(String(number), "page-num" + (number === activePage ? " current" : ""), () => go(route({ page: number }))));
      }
      container.append(paging);
    }
  }
  pageContent.append(container, renderSidebar());
}

function displayDetail(entry) {
  const detail = make("div", "detail");
  detail.append(
    clickable("‹ Back", "card-link", () => go(route({ item: "" }))),
    make("div", "card-kicker", entry.source),
    make("div", "detail-title", entry.title),
    make("div", "detail-body", entry.body),
  );
  if (entry.map) detail.append(campusMap(entry.map), mapLegend(entry.map));
  pageContent.append(detail);
}

function render(updateQuery = false) {
  const previous = state;
  state = readRoute();
  if (updateQuery || previous.query !== state.query || previous.home !== state.home) {
    queryField.value = state.home ? "" : state.query;
  }
  suggestionsMenu.hidden = true;
  filtersMenu.hidden = true;
  $("toolbar").hidden = state.home || Boolean(state.item);
  pageContent.replaceChildren();
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();

  if (state.home) {
    const home = make("div", "home");
    home.append(make("div", "card-title", "Search the campus index"), make("div", "home-text", "Look up campus services, events, maps, and guides."));
    const terms = make("div", "related-card card-body");
    for (const term of suggestions.slice(0, 5)) terms.append(clickable(term, "related-link", () => goQuery(term)));
    home.append(terms);
    pageContent.append(home);
    return;
  }

  const item = entries.find(entry => entry.id === state.item);
  if (item) {
    displayDetail(item);
  } else {
    $("toolbar").hidden = false;
    renderControls();
    displayResults();
  }
}

window.addEventListener("hashchange", () => {
  render();
  window.scrollTo(0, 0);
});

render(true);
</script>
