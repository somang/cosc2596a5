<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fieldnote Search</title>
  <meta name="description" content="A simulated search engine for a fictional campus.">
  <style>
:root {
  font-family: Inter, "Segoe UI", system-ui, sans-serif;
  color: #202937;
  background: #f6f7fb;
  --muted: #8793a7;
  --line: #e2e7ef;
  --blue: #244bc2;
  --navy: #172657;
  --white: #ffffff;
  --amber: #f7bb55;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-width: 1024px; }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; }
button, input { font: inherit; }
button { cursor: pointer; }
:focus, :focus-visible { outline: none; }
.frame { width: min(1136px, calc(100% - 96px)); margin-inline: auto; }
.search-header { background: white; border-bottom: 1px solid var(--line); }
.header-row {
  height: 94px;
  display: grid;
  grid-template-columns: 175px minmax(460px, 652px) 1fr;
  gap: 29px;
  align-items: center;
}
.brand {
  width: fit-content;
  display: inline-flex;
  align-items: center;
  font-size: 28px;
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -.075em;
  color: var(--navy);
}
.brand:hover { text-decoration: none; }
.brand-period { color: #94601c; }
.brand-mark {
  width: 34px;
  height: 34px;
  margin-right: 9px;
  display: inline-grid;
  place-items: center;
  background: var(--blue);
  border-radius: 10px;
}
.brand-mark::before {
  content: "";
  width: 16px;
  height: 16px;
  border: 2px solid white;
  transform: rotate(45deg);
  border-radius: 3px 7px 3px 7px;
  box-shadow: inset 0 0 0 3px var(--blue), inset 0 0 0 8px var(--amber);
}
.edition {
  justify-self: end;
  font-size: 13px;
  font-weight: 650;
  color: #52607b;
  white-space: nowrap;
  padding: 7px 11px;
  border: 1px solid var(--line);
  border-radius: 6px;
}
#search-form { position: relative; }
.search-box {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 49px;
  padding-left: 16px;
  border: 1px solid #cbd5e7;
  border-radius: 8px;
  background: #f8faff;
}
.search-icon {
  display: inline-block;
  position: relative;
  width: 13px;
  height: 13px;
  border: 1.75px solid currentColor;
  border-radius: 50%;
}
.search-icon::after {
  content: "";
  position: absolute;
  height: 1.75px;
  width: 6px;
  bottom: -3px;
  right: -4px;
  transform: rotate(45deg);
  background: currentColor;
  border-radius: 2px;
}
.lead-icon { color: #6c7b96; flex: none; }
#query { flex: 1; min-width: 0; height: 100%; padding: 0 2px; border: none; color: #24324e; background: transparent; }
#query::placeholder { color: #8895aa; }
.clear-query { color: #8490a4; cursor: pointer; font-size: 22px; line-height: 1; }
.search-submit {
  width: 46px;
  height: 43px;
  margin-right: 2px;
  border: none;
  border-radius: 6px;
  background: var(--blue);
  color: white;
}
.search-submit:hover { background: #1b3b9f; }
.suggestions {
  position: absolute;
  z-index: 3;
  top: 55px;
  left: 0;
  right: 0;
  padding: 7px;
  background: white;
  border: 1px solid #d6ddec;
  border-radius: 8px;
  box-shadow: 0 8px 30px #1b2c651c;
}
.suggestion { padding: 8px 13px; border-radius: 4px; cursor: pointer; }
.suggestion:hover { background: #eef2ff; }

.toolbar { display: flex; justify-content: space-between; gap: 20px; padding-left: 204px; height: 43px; }
.tab-row { display: flex; gap: 29px; }
.category, .filters-toggle {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  color: #65728a;
  white-space: nowrap;
}
.category.active { color: var(--blue); }
.category:hover, .filters-toggle:hover { color: #13255a; }
.filters-wrap { position: relative; display: flex; align-items: center; }
.filter-icon {
  display: inline-block;
  width: 15px;
  height: 11px;
  background:
    linear-gradient(90deg, currentColor 80%, transparent 80%) 0 0 / 100% 1px,
    linear-gradient(90deg, currentColor 55%, transparent 55%) 0 5px / 100% 1px,
    linear-gradient(90deg, currentColor 33%, transparent 33%) 0 10px / 100% 1px;
  background-repeat: no-repeat;
}
.filters-menu {
  position: absolute;
  top: 39px;
  right: 0;
  width: 180px;
  padding: 6px;
  z-index: 2;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: white;
  box-shadow: 0 9px 28px #1b2c651a;
}
.filter-option { cursor: pointer; padding: 7px 11px; border-radius: 5px; font-size: 14px; color: #65728a; }
.filter-option.active { color: var(--blue); }
.filter-option:hover { background: #eef2ff; }
.layout { padding-block: 30px 48px; display: grid; grid-template-columns: minmax(0, 1fr) 344px; gap: 34px; align-items: start; min-height: 68vh; }
.results { min-width: 0; }
.results-label, .card-kicker { font-size: 12px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; color: #546890; }
.result-summary { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 13px; gap: 16px; }
.result-count { font-size: 12px; color: var(--muted); }
.result-list {
  border: 1px solid var(--line);
  background: white;
  border-radius: 11px;
  overflow: hidden;
  box-shadow: 0 2px 3px #20336907;
}
.result {
  padding: 17px 21px;
  border-bottom: 1px solid var(--line);
}
.result:last-child { border-bottom: none; }
.result-meta { display: flex; gap: 8px; align-items: center; line-height: 1.25; }
.result-icon { display: grid; place-items: center; flex: none; width: 25px; height: 25px; border-radius: 6px; background: #eaf0ff; color: #3e56a0; font-weight: 800; font-size: 12px; }
.result-source { font-size: 12px; font-weight: 650; color: #56617a; }
.result-path { color: var(--muted); font-weight: 400; margin-left: 2px; font-size: 11px; }
.result-title { display: inline-block; margin: 5px 0 2px; color: var(--blue); font-size: 19px; line-height: 1.3; font-weight: 675; }
.result-description { margin: 2px 0 6px; font-size: 14px; line-height: 1.43; color: #485573; }
.result-detail { font-size: 11px; color: var(--muted); }
.dot { display: inline-block; margin-right: 4px; width: 8px; height: 8px; border-radius: 50%; }
.free { background: #a0b84b; }
.paid { background: #e08741; }
.paging { display: flex; gap: 8px; margin-top: 16px; }
.paging a {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: 4px;
  font-size: 12px;
  background: white;
  color: #66718c;
}
.paging a.current { color: var(--blue); }
.place-card, .related-card {
  border: 1px solid var(--line);
  border-radius: 11px;
  overflow: hidden;
  background: white;
  box-shadow: 0 2px 3px #20336907;
}
.sidebar > * + * { margin-top: 14px; }
.card-body { padding: 17px 19px; }
.card-title { margin: 3px 0 4px; font-weight: 735; font-size: 24px; line-height: 1.14; color: var(--navy); letter-spacing: -.03em; }
.card-subtitle { font-size: 13px; color: #56617a; }
.map {
  position: relative;
  height: 175px;
  overflow: hidden;
  background: repeating-linear-gradient(24deg, #e6eddd 0 34px, #eaf0e4 34px 73px, #e2eadc 73px 105px);
}
.map .road {
  position: absolute;
  width: 125%;
  height: 17px;
  background: #fafaf4;
  border: 1px solid #dce3d5;
}
.map .road-one { left: -12%; top: 48px; transform: rotate(-13deg); }
.map .road-two { left: -8%; top: 112px; transform: rotate(10deg); }
.map .road-three { left: -12%; top: 82px; transform: rotate(-66deg); }
.map .building { position: absolute; width: 41px; height: 25px; background: #d1ddcf; border-radius: 4px; border: 1px solid #c7d4c4; }
.map .library { left: 34px; top: 73px; transform: rotate(-12deg); }
.map .hall { right: 51px; top: 92px; transform: rotate(10deg); }
.map .quad { right: 76px; top: 18px; transform: rotate(-12deg); }
.map .garden { right: 20px; bottom: 13px; transform: rotate(10deg); }
.map-label { position: absolute; color: #6d846a; font-size: 10px; font-weight: 700; }
.map-label.north { left: 12px; top: 12px; }
.map-label.path { left: 20px; bottom: 14px; }
.marker {
  position: absolute;
  cursor: default;
  display: block;
  width: 19px;
  height: 19px;
  border: 3px solid white;
  border-radius: 50% 50% 50% 2px;
  transform: rotate(-45deg);
  box-shadow: 0 1px 5px #2637525c;
}
.marker.one { left: 47%; top: 27%; background: #4151ca; }
.marker.two { left: 73%; top: 57%; background: #cf6641; }
.map-legend { font-size: 11px; color: var(--muted); margin-top: 12px; display: flex; gap: 11px; }
.map-legend .one { background: #4151ca; }
.map-legend .two { background: #cf6641; }
.card-link { display: inline-block; color: var(--blue); font-size: 13px; font-weight: 655; margin-top: 11px; }
.related-card .card-title { font-size: 16px; }
.related-card a { display: block; color: var(--blue); font-size: 14px; margin-top: 7px; }
.empty, .detail, .home {
  background: white;
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 25px;
}
.detail { grid-column: 1 / -1; max-width: 760px; }
.detail h2 { color: var(--navy); font-size: 30px; letter-spacing: -.025em; line-height: 1.2; }
.detail p, .empty p, .home p { line-height: 1.55; color: #485573; }
.detail .map { margin-top: 15px; border-radius: 8px; }
.detail .card-link { margin: 0 0 12px; }
.home { grid-column: 1 / -1; max-width: 720px; }
.home .card-title { font-size: 30px; }
.footer { border-top: 1px solid var(--line); padding-block: 16px 24px; font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="search-header">
    <div class="header-row frame">
      <a href="#home=1" class="brand" aria-label="Fieldnote Search home"><span class="brand-mark" aria-hidden="true"></span>fieldnote<span class="brand-period">.</span></a>
      <form id="search-form" autocomplete="off">
        <div class="search-box">
          <span class="search-icon lead-icon" aria-hidden="true"></span>
          <input id="query" type="text" placeholder="Search" maxlength="120">
          <span id="clear-query" class="clear-query" title="Clear"><span aria-hidden="true">×</span></span>
          <button class="search-submit" type="submit"><span class="search-icon" aria-hidden="true"></span></button>
        </div>
        <div class="suggestions" id="suggestions" hidden></div>
      </form>
      <span class="edition">Campus index</span>
    </div>
    <div class="frame toolbar" id="toolbar">
      <div class="tab-row" id="categories"></div>
      <div class="filters-wrap">
        <div class="filters-toggle" id="filters-toggle"><span class="filter-icon" aria-hidden="true"></span>Filters</div>
        <div class="filters-menu" id="filters-menu" hidden></div>
      </div>
    </div>
  </div>

  <div class="frame layout" id="page"></div>
  <footer class="frame footer">Fieldnote Search · Fictional campus index</footer>
<script>
"use strict";

const entries = [
  {
    id: "bike-hub", type: "Guides", source: "Campus Cycle Hub", path: "cycling › repairs", title: "Campus bike repair and tune-ups",
    snippet: "Find self-service tools, drop-in help, and beginner repair workshops around campus.",
    body: "Borrow an Allen key, tire levers, or a floor pump at the Cycle Hub desk in the Student Centre. Drop-in repair help runs from 12:00 p.m. to 4:00 p.m. on weekdays. Basic tools are free to borrow.",
    metadata: "Campus Services · Updated Nov 12", keywords: "bicycle flat tire parts toolkit", campus: true, free: true,
  },
  {
    id: "north-quad", type: "Maps", source: "Facilities Map", path: "campus › cycling", title: "North Quad bike repair stand map",
    snippet: "See the North Quad repair stand and nearby bike parking on the campus map.",
    body: "Use the map to distinguish the two cycling facilities in North Quad. The repair stand has a pump and tools for basic bike repairs.",
    metadata: "North Quad · Open all day", keywords: "bicycle pump map location", campus: true, free: true, map: true,
  },
  {
    id: "flat-tire", type: "Events", source: "Campus Cycle Hub", path: "events › workshops", title: "Fix a Flat Tire workshop",
    snippet: "Bring your bike to a hands-on flat tire repair session at the Student Centre. Tools and practice tubes are provided.",
    body: "The free workshop takes place on Nov 28 at 1:00 p.m. in the Student Centre, room 112. Learn how to remove a wheel, find a puncture, and patch an inner tube. Registration is available at the Cycle Hub desk.",
    metadata: "Nov 28 · 1:00 p.m.", keywords: "campus bike bicycle repair class workshop", campus: true, free: true,
  },
  {
    id: "gear-clinic", type: "Events", source: "Student Union", path: "events › recreation", title: "Bike repair clinic for gears and chains",
    snippet: "Learn to quiet a noisy chain, adjust gears, and leave with a smoother ride.",
    body: "The clinic takes place on Dec 3 at 4:00 p.m. in the Recreation Annex. The registration fee is $8 and includes a small bottle of chain lubricant.",
    metadata: "Dec 3 · 4:00 p.m.", keywords: "campus bike bicycle repair class workshop", campus: true, free: false,
  },
  {
    id: "tool-loans", type: "Guides", source: "Student Centre", path: "services › tool loans", title: "Borrow bike repair tools at the Student Centre",
    snippet: "Check what is in the campus tool kit and where you can pick it up for the afternoon.",
    body: "Show a student card at the service desk to borrow a toolkit. The kit includes tire levers, metric hex keys, and a pump. Return it before the desk closes at 5:00 p.m.",
    metadata: "Loan desk · Weekdays", keywords: "campus bicycle bike repair equipment", campus: true, free: true,
  },
  {
    id: "riverside", type: "Guides", source: "Riverside Cycles", path: "services › tune-ups", title: "Riverside bike repairs and tune-ups",
    snippet: "Book a paid tune-up near campus or ask about the student rate for basic repairs.",
    body: "Riverside Cycles is at 14 River Street. A basic tune-up starts at $45. Drop off your bike between 10:00 a.m. and 5:00 p.m. from Tuesday to Saturday.",
    metadata: "River Street · Off campus", keywords: "campus bike bicycle repair shop", campus: false, free: false,
  },
  {
    id: "brake-guide", type: "Guides", source: "Campus Cycle Hub", path: "guides › brakes", title: "Check your bike brakes before a ride",
    snippet: "A quick checklist for spotting worn pads, loose cables, and brake levers that need attention.",
    body: "Before you ride, squeeze each brake lever and check that the brake engages. If the lever nearly touches the grip or a pad appears worn, ask a mechanic at the Cycle Hub.",
    metadata: "Bike maintenance · Guide", keywords: "campus bike bicycle repair brakes", campus: true, free: true,
  },
  {
    id: "east-gate", type: "Maps", source: "Facilities Map", path: "campus › entrances", title: "East Gate bike parking and bus stops",
    snippet: "Find bike racks and bus stops at the east entrance to campus.",
    body: "East Gate has covered racks just inside the entrance, near the bus shelter on Campus Road. The bike route continues south toward the Recreation Annex.",
    metadata: "East Campus · Open all day", keywords: "campus bike bicycle parking map commute", campus: true, free: true,
  },
  {
    id: "winter-ride", type: "Events", source: "Ride Together", path: "events › maintenance", title: "Winter bike maintenance workshop",
    snippet: "Learn how to clean and store a bike after riding in snow and road salt.",
    body: "Bring a used rag and a bike light to the free session on Dec 8 at 2:00 p.m. at the Riverside Community Centre.",
    metadata: "Dec 8 · 2:00 p.m.", keywords: "campus bike bicycle repair winter workshop", campus: false, free: true,
  },
  {
    id: "group-ride", type: "Events", source: "Campus Cycling Club", path: "events › rides", title: "Campus cycling club beginner ride",
    snippet: "Join a short group ride from the Student Centre and get familiar with campus bike routes.",
    body: "Meet on Dec 5 at 3:30 p.m. outside the Student Centre. Bring a bike and a helmet. Volunteers will explain the route before the free ride begins.",
    metadata: "Dec 5 · 3:30 p.m.", keywords: "campus bike bicycle cycling beginner route", campus: true, free: true,
  },
  {
    id: "report-rack", type: "Guides", source: "Campus Facilities", path: "requests › cycling", title: "Report a damaged bike rack or pump",
    snippet: "Tell Facilities about a repair station or bike rack that needs maintenance.",
    body: "Contact the Facilities desk and specify the nearest building. The North Quad stand and East Gate racks have distinct location names.",
    metadata: "Campus Services · Requests", keywords: "campus bike bicycle repair pump", campus: true, free: true,
  },
  {
    id: "study-rooms", type: "Guides", source: "Campus Library", path: "library › study spaces", title: "Book a library study room",
    snippet: "Find group study rooms and learn how to reserve a time.",
    body: "Group rooms seat up to four people. Reserve a room at the main library desk or visit the library website during opening hours.",
    metadata: "Library · Study spaces", keywords: "campus library quiet room reservation", campus: true, free: true,
  },
  {
    id: "quiet-study", type: "Maps", source: "Facilities Map", path: "campus › library", title: "Library quiet study floor map",
    snippet: "Find the quiet study area and the nearest elevator in the main library.",
    body: "The quiet study area is on the third floor. The elevator is next to the main entrance.",
    metadata: "Campus Library · Third floor", keywords: "campus library study rooms map", campus: true, free: true,
  },
  {
    id: "bus-pass", type: "Guides", source: "Campus Transit", path: "transit › passes", title: "Activate your student bus pass",
    snippet: "Learn where to pick up your transit pass and load it onto your student card.",
    body: "Bring your student card to the Transit desk in the Student Centre. The desk is open from 9:00 a.m. to 5:00 p.m. on weekdays.",
    metadata: "Student Centre · Weekdays", keywords: "campus bus transit student pass", campus: true, free: false,
  },
  {
    id: "commuter-session", type: "Events", source: "Campus Transit", path: "events › commuting", title: "Getting to campus by bus",
    snippet: "Find out which routes serve campus and how to read the transit timetable.",
    body: "This free orientation runs on Dec 4 at noon in the Student Centre lobby. Bring any questions about buses, transfers, or the student pass.",
    metadata: "Dec 4 · 12:00 p.m.", keywords: "campus student bus transit workshop", campus: true, free: true,
  },
];

const categoryNames = ["All", "Maps", "Events", "Guides"];
const filterNames = { all: "Any result", free: "Free only", campus: "On campus" };
const suggestions = ["campus bike repair", "bike repair workshop", "bike parking", "library study rooms", "student bus pass"];
const defaultQuery = "campus bike repair";
const pageSize = 5;
const element = id => document.getElementById(id);
const create = (tag, className, content) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (content) node.textContent = content;
  return node;
};

const queryField = element("query");
const suggestionsMenu = element("suggestions");
const filtersMenu = element("filters-menu");
const pageContent = element("page");

function route(overrides = {}, base = state) {
  const next = { ...base, ...overrides };
  const params = new URLSearchParams();
  if (next.home) return "#home=1";
  params.set("q", next.query);
  if (next.category !== "All") params.set("type", next.category);
  if (next.filter !== "all") params.set("filter", next.filter);
  if (next.page > 1) params.set("page", next.page);
  if (next.item) params.set("item", next.item);
  return "#" + params.toString();
}

function readRoute() {
  const params = new URLSearchParams(window.location.hash.slice(1));
  return {
    home: params.get("home") === "1",
    query: (params.get("q") ?? defaultQuery).trim().slice(0, 120),
    category: categoryNames.includes(params.get("type")) ? params.get("type") : "All",
    filter: Object.hasOwn(filterNames, params.get("filter")) ? params.get("filter") : "all",
    page: Math.max(1, Number.parseInt(params.get("page"), 10) || 1),
    item: params.get("item") || "",
  };
}

let state = readRoute();

function link(text, className, href) {
  const node = create("a", className, text);
  node.href = href;
  return node;
}

function queryLink(text, search) {
  return link(text, "", route({ home: false, query: search, category: "All", filter: "all", page: 1, item: "" }));
}

function search(term) {
  const query = term.trim();
  queryField.value = query;
  suggestionsMenu.hidden = true;
  const destination = route({ home: !query, query, category: "All", filter: "all", page: 1, item: "" });
  if (window.location.hash === destination) render();
  else window.location.hash = destination;
}

element("search-form").addEventListener("submit", event => {
  event.preventDefault();
  search(queryField.value);
});
queryField.addEventListener("input", () => {
  const term = queryField.value.trim().toLowerCase();
  const matches = term ? suggestions.filter(option => option.includes(term) && option !== term) : [];
  suggestionsMenu.replaceChildren();
  for (const value of matches) {
    const node = create("div", "suggestion", value);
    node.addEventListener("click", () => search(value));
    suggestionsMenu.append(node);
  }
  suggestionsMenu.hidden = !matches.length;
});
element("clear-query").addEventListener("click", () => {
  queryField.value = "";
  queryField.focus();
  suggestionsMenu.hidden = true;
});
element("filters-toggle").addEventListener("click", () => {
  filtersMenu.hidden = !filtersMenu.hidden;
});
document.addEventListener("click", event => {
  if (!element("search-form").contains(event.target)) suggestionsMenu.hidden = true;
  if (!event.target.closest(".filters-wrap")) filtersMenu.hidden = true;
});

function rank(query) {
  const words = (query.toLowerCase().match(/[\p{L}\p{N}]+/gu) || []).filter(word => word.length > 1);
  if (!words.length) return [];
  const results = [];
  for (const entry of entries) {
    const haystack = [entry.title, entry.snippet, entry.keywords, entry.source].join(" ").toLowerCase();
    const matched = words.filter(word => haystack.includes(word));
    if (matched.length < Math.ceil(words.length * 0.67)) continue;
    const exact = entry.title.toLowerCase().includes(query.toLowerCase()) ? 12 : 0;
    const titleHits = matched.filter(word => entry.title.toLowerCase().includes(word)).length;
    results.push({ entry, score: exact + matched.length * 4 + titleHits * 2 });
  }
  return results.sort((a, b) => b.score - a.score).map(match => match.entry);
}

function renderControls() {
  const categories = element("categories");
  categories.replaceChildren();
  for (const category of categoryNames) {
    const tab = create("div", "category" + (state.category === category ? " active" : ""), category);
    tab.addEventListener("click", () => {
      window.location.hash = route({ category, page: 1 });
    });
    categories.append(tab);
  }

  filtersMenu.replaceChildren();
  for (const [value, description] of Object.entries(filterNames)) {
    const option = create("div", "filter-option" + (state.filter === value ? " active" : ""), description);
    option.addEventListener("click", () => {
      filtersMenu.hidden = true;
      window.location.hash = route({ filter: value, page: 1 });
    });
    filtersMenu.append(option);
  }
  element("filters-toggle").lastChild.textContent = state.filter === "all" ? "Filters" : "Filters · " + filterNames[state.filter];
}

function campusMap() {
  const map = create("div", "map");
  for (const type of ["road road-one", "road road-two", "road road-three", "building library", "building hall", "building quad", "building garden"]) {
    map.append(create("span", type));
  }
  map.append(create("span", "map-label north", "NORTH QUAD"), create("span", "map-label path", "COLLEGE WALK"));
  map.append(create("span", "marker one"), create("span", "marker two"));
  return map;
}

function mapLegend() {
  const legend = create("div", "map-legend");
  for (const [color, text] of [["one", "Repair stand"], ["two", "Bike parking"]]) {
    const key = create("span", "", "");
    key.append(create("i", "dot " + color), document.createTextNode(text));
    legend.append(key);
  }
  return legend;
}

function renderSidebar(bikeSearch) {
  const sidebar = create("div", "sidebar");
  if (bikeSearch) {
    const place = create("div", "place-card");
    const details = create("div", "card-body");
    details.append(
      create("div", "card-kicker", "Campus map"),
      create("div", "card-title", "North Quad"),
      create("div", "card-subtitle", "Cycling facilities"),
      mapLegend(),
      link("View map", "card-link", route({ item: "north-quad" })),
    );
    place.append(campusMap(), details);
    sidebar.append(place);
  }

  const related = create("div", "related-card");
  const details = create("div", "card-body");
  details.append(create("div", "card-title", "Related searches"));
  for (const term of (bikeSearch ? ["bike repair workshop", "bike parking", "campus bike repair"] : ["campus bike repair", "library study rooms", "student bus pass"])) {
    if (term !== state.query.toLowerCase()) details.append(queryLink(term, term));
  }
  related.append(details);
  sidebar.append(related);
  return sidebar;
}

function renderResult(entry) {
  const result = create("div", "result");
  const meta = create("div", "result-meta");
  const icon = create("span", "result-icon", entry.source[0]);
  icon.setAttribute("aria-hidden", "true");
  const source = create("div", "result-source", entry.source);
  source.append(create("span", "result-path", " › " + entry.path));
  meta.append(icon, source);

  const detail = create("div", "result-detail", "");
  if (entry.type === "Events") detail.append(create("i", "dot " + (entry.free ? "free" : "paid")));
  detail.append(document.createTextNode(entry.metadata));
  result.append(
    meta,
    link(entry.title, "result-title", route({ item: entry.id })),
    create("p", "result-description", entry.snippet),
    detail,
  );
  return result;
}

function displayResults() {
  const results = rank(state.query).filter(entry => {
    const categoryMatches = state.category === "All" || entry.type === state.category;
    const filterMatches = state.filter === "all" || (state.filter === "free" && entry.free) || (state.filter === "campus" && entry.campus);
    return categoryMatches && filterMatches;
  });

  const container = create("div", "results");
  const summary = create("div", "result-summary");
  const label = state.category === "All" ? "Search results" : state.category + " results";
  const count = results.length + (results.length === 1 ? " result" : " results");
  summary.append(create("div", "results-label", label), create("div", "result-count", count));
  container.append(summary);
  if (!results.length) {
    const empty = create("div", "empty");
    empty.append(
      create("div", "card-title", "No results found"),
      create("p", "", "No matches for “" + state.query + "”. Try different words or change your filters."),
      queryLink("Try campus bike repair", defaultQuery),
    );
    container.append(empty);
  } else {
    const pages = Math.ceil(results.length / pageSize);
    const activePage = Math.min(state.page, pages);
    const start = (activePage - 1) * pageSize;
    const list = create("div", "result-list");
    for (const result of results.slice(start, start + pageSize)) list.append(renderResult(result));
    container.append(list);

    if (pages > 1) {
      const paging = create("div", "paging");
      for (let number = 1; number <= pages; number++) {
        paging.append(link(String(number), number === activePage ? "current" : "", route({ page: number })));
      }
      container.append(paging);
    }
  }
  pageContent.append(container, renderSidebar(/bike|bicycle|cycling/i.test(state.query)));
}

function displayDetail(entry) {
  const detail = create("div", "detail");
  detail.append(
    link("Back to results", "card-link", route({ item: "" })),
    create("div", "card-kicker", entry.source),
    create("h2", "", entry.title),
    create("p", "", entry.body),
  );
  if (entry.map) detail.append(campusMap(), mapLegend());
  pageContent.append(detail);
}

function render(updateQuery = false) {
  const previous = state;
  state = readRoute();
  if (updateQuery || previous.query !== state.query || previous.home !== state.home) {
    queryField.value = state.home ? "" : state.query;
  }
  suggestionsMenu.hidden = true;
  filtersMenu.hidden = true;
  element("toolbar").hidden = state.home || Boolean(state.item);
  pageContent.replaceChildren();

  if (state.home) {
    const home = create("div", "home");
    home.append(create("div", "card-title", "Search the campus index"), create("p", "", "Look up campus services, events, maps, and guides."));
    const terms = create("div", "related-card card-body");
    for (const term of suggestions.slice(0, 3)) terms.append(queryLink(term, term));
    home.append(terms);
    pageContent.append(home);
    return;
  }

  const item = entries.find(entry => entry.id === state.item);
  if (item) {
    displayDetail(item);
  } else {
    element("toolbar").hidden = false;
    renderControls();
    displayResults();
  }
}

window.addEventListener("hashchange", () => {
  const previous = state;
  render();
  if (previous.item || state.item || previous.home !== state.home || previous.query !== state.query || previous.page !== state.page) {
    window.scrollTo(0, 0);
  }
});

render(true);
</script>
</body>
</html>
